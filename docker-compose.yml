services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gx_portfolio_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gx_pi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gx_portfolio_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20

  gx-pi:
    profiles: ["service"]
    build:
      context: ..
      dockerfile: gx.portfolio.intelligence/Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      simple-rag:
        condition: service_healthy
    ports:
      - "4010:4010"
    volumes:
      - gx_pi_artifacts:/data/gx-pi/artifacts
    restart: unless-stopped

  simple-rag:
    profiles: ["service"]
    build:
      context: ../SimpleRAGChatBot
      dockerfile: Dockerfile
    environment:
      RAG_BASE_DIR: /app
      RAG_DATA_DIR: /data
      RAG_PAPERS_DIR: /app/papers
      RAG_SERVICE_API_KEY: ${RAG_SERVICE_API_KEY:-}
      RAG_OLLAMA_BASE_URL: ${SIMPLE_RAG_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-gemma4:e2b}
      RAG_ANSWER_NUM_PREDICT: ${RAG_ANSWER_NUM_PREDICT:-2048}
      RAG_ADVANCED_ANSWER_NUM_PREDICT: ${RAG_ADVANCED_ANSWER_NUM_PREDICT:-1024}
      RAG_REWRITE_NUM_PREDICT: ${RAG_REWRITE_NUM_PREDICT:-96}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_EMBED_DEVICE: cpu
      RAG_HYBRID_SEARCH: ${RAG_HYBRID_SEARCH:-0}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-0}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RAG_RERANK_DEVICE: cpu
      RAG_RERANK_CANDIDATE_K: ${RAG_RERANK_CANDIDATE_K:-40}
      RAG_RERANK_CHILD_K: ${RAG_RERANK_CHILD_K:-12}
      RAG_RERANK_MIN_SCORE: ${RAG_RERANK_MIN_SCORE:-0.5}
      RAG_AGENTIC_ENABLED: ${RAG_AGENTIC_ENABLED:-0}
      RAG_SELF_CHECK_ENABLED: ${RAG_SELF_CHECK_ENABLED:-0}
      RAG_GRAPH_BUILD_ENABLED: ${RAG_GRAPH_BUILD_ENABLED:-0}
      RAG_GRAPH_ENABLED: ${RAG_GRAPH_ENABLED:-0}
      RAG_REVIEW_MODEL: ${RAG_REVIEW_MODEL:-${RAG_CHAT_MODEL:-gemma4:e2b}}
      RAG_GRAPH_EXTRACTOR_MODEL: ${RAG_GRAPH_EXTRACTOR_MODEL:-${RAG_CHAT_MODEL:-gemma4:e2b}}
      RAG_AGENT_TIMEOUT_SECONDS: ${RAG_AGENT_TIMEOUT_SECONDS:-120}
      RAG_AGENT_MAX_RETRIEVAL_ROUNDS: ${RAG_AGENT_MAX_RETRIEVAL_ROUNDS:-2}
      RAG_AGENT_MAX_SUBQUERIES: ${RAG_AGENT_MAX_SUBQUERIES:-3}
      RAG_AGENT_MAX_TOOL_CALLS: ${RAG_AGENT_MAX_TOOL_CALLS:-4}
      RAG_SELF_CHECK_MAX_ANSWER_ATTEMPTS: ${RAG_SELF_CHECK_MAX_ANSWER_ATTEMPTS:-2}
      RAG_GRAPH_MAX_HOPS: ${RAG_GRAPH_MAX_HOPS:-2}
      RAG_GRAPH_WORKER_CONCURRENCY: "1"
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      LANGSMITH_TRACING: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - simple_rag_data:/data
      - simple_rag_models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    init: true
    restart: unless-stopped

volumes:
  gx_pi_postgres:
  gx_pi_artifacts:
  simple_rag_data:
  simple_rag_models:
